[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spraakherkenning-scriptie"
version = "0.1.0"
description = "Accuracy-first Dutch two-speaker diarization pipeline for long interview audio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.0",
  "numpy>=1.26",
  "pyannote.audio>=3.3.2",
  "python-dotenv>=1.0.1",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
spraakherkenning = "src.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
